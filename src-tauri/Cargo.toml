[package]
name = "nusic-studio"
version = "0.1.0"
description = "Nusic Studio: local AI music studio"
authors = ["PeanutGT"]
license = "Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nusic_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "pcm", "mp3", "ogg", "vorbis"] }
ebur128 = "0.1.11"
hound = "3.5.1"
flacenc = "0.5.1"
rustfft = "6.4.1"
mp3lame-encoder = "0.3.0"
vorbis_rs = "0.5.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Audio crates (FFT, EBU R128 meter, codecs) are 10-50x slower unoptimised; keep debug builds
# and `cargo test` usable without touching how our own code is built.
[profile.dev.package."*"]
opt-level = 2
